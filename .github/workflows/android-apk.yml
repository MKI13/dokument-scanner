name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Code holen
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node.js 22 (zwingend für Capacitor)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️⃣ Kontrolle: Node-Version anzeigen
      - name: Verify Node version
        run: node -v

      # 4️⃣ Abhängigkeiten frisch installieren
      - name: Install dependencies
        run: npm install

      # 5️⃣ Web-App bauen (Vite / React)
      - name: Build web app
        run: npm run build

      # 6️⃣ Capacitor CLI GLOBAL installieren (wichtig!)
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@latest

      # 7️⃣ Capacitor Android synchronisieren
      - name: Sync Capacitor Android
        run: cap sync android

      # 8️⃣ Java 17 für Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 9️⃣ APK bauen
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 🔟 APK hochladen
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
